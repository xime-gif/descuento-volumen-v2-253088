name: Deploy a AWS Lambda

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir, etiquetar y subir imagen a ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: descuento-volumen
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker buildx build --platform linux/amd64 --provenance=false -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Actualizar función Lambda
        run: |
          aws lambda update-function-code --function-name descuento-docker --image-uri ${{ env.IMAGE }}
          aws lambda wait function-updated --function-name descuento-docker

      - name: Prueba de funcionamiento (Smoke Test)
        run: |
          aws lambda invoke --function-name descuento-docker --payload '{"unidades":150,"precioCentavos":2500}' r.json
          cat r.json
          jq -e '.porcentaje == 10' r.json
